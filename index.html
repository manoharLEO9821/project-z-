<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leo's Shoppyee</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <h1 class="logo">Leo's Shoppyee</h1>
    <div class="cart-icon-container" id="cartBtn">
      🛒 Cart (<span id="cartCount">0</span>)
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    <!-- Category Filter Sidebar -->
    <aside class="sidebar">
      <h3>Categories</h3>
      <ul class="filter-list">
        <li><button class="filter-btn active" data-category="All">All Items</button></li>
        <li><button class="filter-btn" data-category="Mobiles">Mobiles</button></li>
        <li><button class="filter-btn" data-category="Electronics">Electronics</button></li>
        <li><button class="filter-btn" data-category="Appliances">Appliances</button></li>
        <li><button class="filter-btn" data-category="Furniture">Furniture</button></li>
        <li><button class="filter-btn" data-category="Kitchen">Kitchen</button></li>
        <li><button class="filter-btn" data-category="Food">Food & Drinks</button></li>
        <li><button class="filter-btn" data-category="Books">Books & Pens</button></li>
        <li><button class="filter-btn" data-category="Clothing">Clothing</button></li>
        <li><button class="filter-btn" data-category="Footwear">Footwear</button></li>
        <li><button class="filter-btn" data-category="Bags">Bags</button></li>
        <li><button class="filter-btn" data-category="Gym">Gym</button></li>
      </ul>
    </aside>

    <!-- Product Grid -->
    <section class="products-section">
      <h2 id="categoryTitle">All Products</h2>
      <div class="product-grid" id="productGrid"></div>
    </section>
  </main>

  <!-- Slide-out Cart Sidebar -->
  <div class="cart-modal" id="cartModal">
    <div class="cart-content">
      <div class="cart-header">
        <h2>Your Shopping Cart</h2>
        <span class="close-btn" id="closeCartBtn">&times;</span>
      </div>
      <div class="cart-body" id="cartItemsContainer"></div>
      <div class="cart-footer">
        <h3>Total: ₹<span id="cartTotal">0</span></h3>
        <button class="checkout-btn">Checkout</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
